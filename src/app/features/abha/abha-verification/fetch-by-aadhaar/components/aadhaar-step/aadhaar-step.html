<div class="verification-page">

    <div class="container">

        <h2 class="page-title">
            ABHA Verification
        </h2>

        <!-- Stepper -->

        <div class="stepper">

            <div class="step active">
                <div class="circle">1</div>
                <span>Aadhaar Number</span>
            </div>

            <!-- <div class="line"></div>

            <div class="step">
                <div class="circle">2</div>
                <span>Auth Mode</span>
            </div> -->

            <div class="line"></div>

            <div class="step">
                <div class="circle">3</div>
                <span>OTP</span>
            </div>

            <div class="line"></div>

            <div class="step">
                <div class="circle">4</div>
                <span>ABHA Profile</span>
            </div>

        </div>

    
        <div class="card verification-card">

            <h3 class="section-title">
                Aadhaar Number
            </h3>

            <hr>

            <div class="row align-items-end">

                <div class="col-lg-7">

                    <label class="form-label">
                        Enter Aadhaar Number
                    </label>

                    <!-- <input
                        type="text"
                        class="form-control form-control-lg"
                        [(ngModel)]="aadhaarNumber"
                        placeholder="123456789014"> -->

                    <input
                        type="text"
                        class="form-control form-control-lg"
                        placeholder="Enter Aadhaar Number"

                        maxlength="12"

                        [(ngModel)]="aadhaarNumber"

                        (keypress)="onlyNumber($event)"

                        (input)="onInput($event)" style="font-size: 22px;" >

                    @if(aadhaarNumber && aadhaarNumber.length < 12){

                        <small class="text-danger">
                            Aadhaar Number must contain exactly 12 digits.
                        </small>

                    }


                </div>

                <!-- <div class="col-lg-5 text-end mt-3 mt-lg-0">

                    <button
                        class="btn btn-primary btn-action me-2"
                        (click)="sendOTP()">

                        <i class="bi bi-search"></i>
                        Send OTP

                    </button>

                    <button
                        class="btn btn-dark btn-action"
                        (click)="goBack()">

                        <i class="bi bi-arrow-left"></i>
                        Back

                    </button>

                </div> -->

            </div>
            <br><br>
            <div class="row align-items-end">
                <div class="col-lg-5">

                    <button
                        class="btn btn-primary btn-action me-2"
                        (click)="sendOTP()">

                        <!-- <i class="bi bi-search"></i> -->
                        Send OTP

                    </button>

                    <button
                        class="btn btn-dark btn-action"
                        (click)="goBack()">

                        <i class="bi bi-arrow-left"></i>
                        Back

                    </button>

                </div>
            </div>


        </div>

    </div>

</div>
