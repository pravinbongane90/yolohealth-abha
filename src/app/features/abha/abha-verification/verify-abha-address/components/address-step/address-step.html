<div class="verification-page">

    <div class="container">

        <h2 class="page-title">
            ABHA Verification
        </h2>

        <!-- Stepper -->

        <div class="stepper">

            <div class="step active">
                <div class="circle">1</div>
                <span>ABHA Address</span>
            </div>

            <!-- <div class="line"></div>

            <div class="step">
                <div class="circle">2</div>
                <span>Auth Mode</span>
            </div> -->

            <div class="line"></div>

            <div class="step">
                <div class="circle">3</div>
                <span>Verify OTP</span>
            </div>

            <div class="line"></div>

            <div class="step">
                <div class="circle">4</div>
                <span>ABHA Profile</span>
            </div>

        </div>

    
        <div class="card verification-card">

            <h3 class="section-title">
                Verify ABHA Address
            </h3>

            <hr>

            <div class="row align-items-end">

                <div class="col-lg-7">

                    <label class="form-label">
                        Enter ABHA Address
                    </label>

                    <input
                        type="text"
                        class="form-control form-control-lg"
                        [(ngModel)]="abhaAddress"
                        placeholder="example@abdm">

                </div>

                <div class="col-lg-5 text-end mt-3 mt-lg-0">

                    <button
                        class="btn btn-primary btn-action me-2"
                        (click)="searchAddress()">

                        <i class="bi bi-search"></i>
                        Search

                    </button>

                    <button
                        class="btn btn-dark btn-action"
                        (click)="goBack()">

                        <i class="bi bi-arrow-left"></i>
                        Back

                    </button>

                </div>

            </div>

            @if(showAuthDropdown){

            <div class="auth-section">

                <hr>

                <div class="row align-items-end">

                    <div class="col-lg-7">

                        <label class="form-label">

                            Select Authentication Mode

                        </label>

                        <select
                            class="form-select form-select-lg"
                            [(ngModel)]="selectedAuthMethod">

                            <option value="">
                                Select Authentication Mode
                            </option>

                            @for(method of authMethods; track method){

                                <option [value]="method">
                                    {{method}}
                                </option>

                            }

                        </select>

                    </div>

                    <div class="col-lg-5 text-end mt-3 mt-lg-0">

                        @if(selectedAuthMethod){

                        <button
                            class="btn btn-success btn-action"
                            (click)="clickNext()">

                            Next
                            <i class="bi bi-arrow-right"></i>

                        </button>

                        }

                    </div>

                </div>

            </div>

            }

        </div>

    </div>

</div>
