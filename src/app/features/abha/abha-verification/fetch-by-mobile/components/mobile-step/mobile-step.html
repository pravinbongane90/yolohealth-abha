<div class="verification-page">

    <div class="container">

        <h2 class="page-title">
            ABHA Verification
        </h2>

        <!-- Stepper -->

        <div class="stepper">

            <div class="step active">
                <div class="circle">1</div>
                <span>Mobile Number</span>
            </div>

            <div class="line"></div>

            <div class="step">
                <div class="circle">2</div>
                <span>Select ABHA Profile</span>
            </div>

            <div class="line"></div>

            <div class="step">
                <div class="circle">3</div>
                <span>Verify OTP</span>
            </div>

            <div class="line"></div>

            <div class="step">
                <div class="circle">4</div>
                <span>ABHA Profile</span>
            </div>

        </div>

    
        <div class="card verification-card">

            <h3 class="section-title">
                Find ABHA Using Mobile Number
            </h3>

            <hr>

            <div class="row align-items-end">

                <div class="col-lg-7">

                    <label class="form-label">
                        Enter Mobile Number
                    </label>

                    <!-- <input
                        type="text"
                        class="form-control form-control-lg"
                        [(ngModel)]="aadhaarNumber"
                        placeholder="123456789014"> -->

                    <input
                        type="text"
                        class="form-control form-control-lg"
                        placeholder="Enter Mobile Number"

                        maxlength="12"

                        [(ngModel)]="mobileNumber"

                        (keypress)="onlyNumber($event)"

                        (input)="onInput($event)" style="font-size: 22px;" >

                    @if(mobileNumber && mobileNumber.length < 10){

                        <small class="text-danger">
                            Mobile Number must contain exactly 10 digits.
                        </small>

                    }


                </div>


            </div>
            <br><br>
            <div class="row align-items-end">
                <div class="col-lg-5">

                    <button
                        class="btn btn-primary btn-action me-2"
                        (click)="searchNumber()">

                        <i class="bi bi-search"></i>
                        Search
                    </button>

                    <button
                        class="btn btn-dark btn-action"
                        (click)="goBack()">

                        <i class="bi bi-arrow-left"></i>
                        Back

                    </button>

                </div>
            </div>


        </div>

    </div>

</div>
