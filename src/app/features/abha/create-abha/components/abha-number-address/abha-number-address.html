<div class="page">

    <h2 class="title">
        CREATE ABHA ADDRESS/NUMBER
    </h2>
    <hr>

    <div class="stepper">

        <div class="step done">

            <div class="circle">
                ✓
            </div>

            <span>Aadhaar Number</span>

        </div>

        <div class="step done "></div>

        <div class="step done">

            <div class="circle">
                    ✓
            </div>

            <span>Aadhaar Authentication</span>

        </div>

        <div class="step done "></div>

        <div class="step">
                <div class="circle">3</div>
                <span>Mobile Link With ABHA</span>
        </div>

        <div class="step done">

            <div class="circle">
                ✓
            </div>

            <span>ABHA Number</span>

        </div>

        <div class="step done "></div>
        
                <div class="step done">

            <div class="circle">
                ✓
            </div>

            <span>ABHA Address</span>

        </div>

        <div class="step done "></div>
        

        <div class="line"></div>

        <div class="step active">
            <div class="circle">6</div>
            <span>ABHA Number/Address/Card</span>
            </div>

        <div class="line active"></div>


        <div class="line"></div>

        <div class="step">
            <div class="circle">7</div>
            <span>ABHA Profile</span>
        </div>

    </div>
    <hr>

    <div class="step-card">

        <hr>

        <div class="row mt-4">

            <div class="col-md-4">

                <label class="form-label">

                    Your ABHA Address

                </label>

                <input
                    type="text"
                    class="form-control"
                    [value]="abhaAddress"
                    readonly>

            </div>

            <div class="col-md-4">

                <label class="form-label">

                    Your ABHA Number

                </label>

                <input
                    type="text"
                    class="form-control"
                    [value]="abhaNumber"
                    readonly>

            </div>

            <div class="col-md-4 d-flex align-items-end">

                <button
                    class="btn btn-info text-white w-100"
                    (click)="previewCard()" style="font-size: 18px; font-weight: 500;">

                    <i class="bi bi-image me-2"></i>

                    Preview PNG

                </button>

            </div>

        </div>

        <hr>

        <div class="button-group">

            <button
                class="btn btn-secondary px-4"
                (click)="previousBtn()" style="font-size: 18px; font-weight: 500;">

                ← Back

            </button>

            <button
                class="btn btn-success px-4"
                (click)="nextBtn()" style="font-size: 18px; font-weight: 500;">

                Next

            </button>

        </div>

    </div>
</div>



@if(showPreview){

<div class="preview-overlay">

    <div class="preview-card">

        <div class="preview-header">

            <h5>ABHA Card Preview</h5>

            <button
                class="btn-close"
                (click)="closePreview()">
            </button>

        </div>

        <div class="preview-body">

            <img
                [src]="cardImage"
                class="img-fluid"
                alt="ABHA Card">

        </div>

    </div>

</div>

}
