<div class="verification-page">

    <div class="container">

        <h2 class="page-title">
            ABHA Verification
        </h2>

        <!-- Stepper -->
         <hr>

        <div class="stepper">

            <div class="step completed">
                <div class="circle">
                    ✓
                </div>
                <span>Number</span>
            </div>

            <!-- <div class="line active"></div>

            <div class="step completed">
                <div class="circle">
                    ✓
                </div>
                <span>Auth Mode</span>
            </div> -->

            <div class="line active"></div>

            <div class="step active">
                <div class="circle">
                    2
                </div>
                <span>Verify OTP</span>
            </div>

            <div class="line"></div>

            <div class="step">
                <div class="circle">
                    3
                </div>
                <span>ABHA Profile</span>
            </div>

        </div>
        <hr>

        <div class="card verification-card">

            <h3>
                Verify OTP
            </h3>

            <hr>

            <label class="form-label">

                Enter OTP

            </label>

            <input
                maxlength="6"
                class="form-control form-control-lg otp-box"
                placeholder="Enter 6 Digit OTP"
                [(ngModel)]="otp"
                (input)="validateOTP()">

            @if(errorMessage){

                <div class="text-danger mt-2">

                    {{errorMessage}}

                </div>

            }

            @if(successMessage){

                <div class="text-success mt-2">

                    {{successMessage}}

                </div>

            }

            <div class="timer">

                @if(counter > 0){

                    <span>

                        Resend OTP in
                        <b>{{counter}}</b>
                        sec

                    </span>

                }

                @else{

                    <a
                        href="javascript:void(0)"
                        (click)="resendOTP()">

                        Resend OTP

                    </a>

                }

            </div>

            <div class="button-group">

                <button
                    class="btn btn-success btn-action"
                    (click)="verifyOTP()">

                    Verify OTP

                </button>

                <button
                    class="btn btn-secondary btn-action"
                    (click)="goBack()">

                    Back

                </button>

            </div>

        </div>

    </div>

</div>
